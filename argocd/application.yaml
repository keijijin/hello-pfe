apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-pfe
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/keijijin/hello-pfe.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-pfe
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    managedNamespaceMetadata:
      labels:
        pfe-lab/guardrails: enabled
